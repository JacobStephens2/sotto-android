name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@v4
        with:
          path: third_party
          key: thirdparty-sherpa1.13.2-kokoro-int8-v1_0
      - name: Fetch and stage third-party
        run: tools/fetch-third-party.sh
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > /tmp/sotto-release.keystore
      - name: Build signed releases (both flavors)
        env:
          SOTTO_KEYSTORE: /tmp/sotto-release.keystore
          SOTTO_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          SOTTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SOTTO_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew --no-daemon testLocalDebugUnitTest assembleLocalRelease assembleSyncRelease
      - name: Verify the claim and collect artifacts
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          mkdir -p dist
          cp app/build/outputs/apk/local/release/*.apk app/build/outputs/apk/sync/release/*.apk dist/
          cd dist
          LOCAL=$(ls sotto-local-*.apk)
          { echo '## Verification'; echo; echo 'The local artifact holds no network permission - check it yourself:'; echo
            echo '```'; echo "$ aapt dump permissions $LOCAL"; "$AAPT" dump permissions "$LOCAL"; echo '```'; echo
            echo '## Checksums'; echo '```'; sha256sum *.apk; echo '```'; } > notes.md
          grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" <("$AAPT" dump permissions "$LOCAL") && { echo "ABORT: local claims violated"; exit 1; } || true
      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Sotto $GITHUB_REF_NAME" --notes-file dist/notes.md
