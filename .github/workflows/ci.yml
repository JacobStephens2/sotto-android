name: ci
on:
  push: { branches: [master] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@v4
        with:
          path: third_party
          key: thirdparty-sherpa1.13.2-kokoro-int8-v1_0
      - name: Fetch and stage third-party (AAR + model)
        run: tools/fetch-third-party.sh
      - name: Unit tests + assemble
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Manifest guard - zero permissions (constitution boundary 3)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          PERMS=$("$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -c "uses-permission" || true)
          echo "uses-permission count: $PERMS"
          test "$PERMS" -eq 0 || { echo "FAIL: permissions crept into the manifest"; exit 1; }
      - name: Test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-results, path: app/build/test-results }
