name: ci
on:
  push: { branches: [master] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@v4
        with:
          path: third_party
          key: thirdparty-sherpa1.13.2-kokoro-int8-v1_0
      - name: Fetch and stage third-party (AAR + model)
        run: tools/fetch-third-party.sh
      - name: Unit tests + assemble
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Manifest guard - no network permissions (constitution boundary 3)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/perms.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" /tmp/perms.txt; then
            echo "FAIL: network permission in the local build"; exit 1
          fi
          ALLOWED="FOREGROUND_SERVICE|FOREGROUND_SERVICE_MEDIA_PLAYBACK|POST_NOTIFICATIONS|WAKE_LOCK"
          EXTRA=$(grep "uses-permission" /tmp/perms.txt | grep -vE "$ALLOWED" || true)
          [ -z "$EXTRA" ] || { echo "FAIL: unexpected permission(s): $EXTRA"; exit 1; }
      - name: Test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-results, path: app/build/test-results }
